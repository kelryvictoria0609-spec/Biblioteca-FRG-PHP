<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIBLIOTECA FRG | Escolha seu acesso</title>
  <link rel="icon" href="/img/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/style.css?v=6">
  <link rel="stylesheet" href="/css/painel.css?v=6">
</head>
<body class="pagina-entrada">

  <!-- Botão de modo claro/escuro no canto -->
  <button id="btnTema" class="btn-tema btn-tema-canto" type="button">🌙 Modo escuro</button>

  <main class="entrada-caixa">

    <!-- TOPO DO CARTÃO: logos -->
    <div class="entrada-topo">
      <div class="logo-prefeitura" id="logoPrefeitura">
        <img class="logo-claro" src="/img/logo-prefeitura.png" alt="Logo da Prefeitura">
        <img class="logo-escuro" src="/img/logo-prefeitura-escuro.png" alt="Logo da Prefeitura">
      </div>
      <div class="logo-sistema logo-centralizado">
        <svg class="logo-icone" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="var(--azul)"/>
          <path d="M10 14h11a3 3 0 0 1 3 3v19a3 3 0 0 0-3-3H10z" fill="#fff"/>
          <path d="M38 14H27a3 3 0 0 0-3 3v19a3 3 0 0 1 3-3h11z" fill="#fff" opacity=".85"/>
          <path d="M28 21l3 3 6-7" fill="none" stroke="#3fbf55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="logo-texto">
          <strong><span class="logo-nome">BIBLIOTECA</span> <span class="logo-sigla">SME-FRG</span></strong>
          <small>Secretaria de Educação</small>
        </div>
      </div>
    </div>
    <div class="linha-gradiente"></div>

    <!-- CORPO DO CARTÃO -->
    <div class="entrada-corpo">
      <h1>Como você quer entrar?</h1>
      <p class="entrada-sub">Escolha uma opção para continuar.</p>

      <!-- ESCOLHA: visitante ou administrador -->
      <div id="escolhas" class="escolhas">
        <a class="escolha escolha-visitante" href="/biblioteca">
          <span class="escolha-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/>
              <path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>
            </svg>
          </span>
          <span class="escolha-titulo">Visitante</span>
          <span class="escolha-desc">Consultar e ler os livros do acervo</span>
        </a>

        <button class="escolha escolha-admin" id="btnAdmin" type="button">
          <span class="escolha-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </span>
          <span class="escolha-titulo">Administrador</span>
          <span class="escolha-desc">Cadastrar e gerenciar os livros</span>
        </button>
      </div>

      <!-- LOGIN DO ADMINISTRADOR (aparece ao clicar em "Administrador") -->
      <form id="formLogin" class="form-login" hidden>
        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>

        <p id="erroLogin" class="msg-erro" hidden></p>

        <button class="btn-principal" type="submit">Entrar</button>
        <button class="btn-link" id="btnVoltar" type="button">← Voltar</button>
      </form>
    </div>

    <div class="entrada-rodape">
      Secretaria Municipal de Educação · Prefeitura Municipal de Fazenda Rio Grande
    </div>
  </main>

  <script src="/js/tema.js?v=6"></script>
  <script src="/js/senha.js?v=6"></script>
  <script src="/js/entrada.js?v=6"></script>
</body>
</html>
